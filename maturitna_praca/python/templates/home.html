<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='homestyles.css') }}">
    <title>Riftout</title>
</head>
<body>
    <header>
        <a href="/homepage"><h1 style="font-size:150%">Riftout</h1></a>
        
        <nav id="nav-list">
            <ul>
                <li class="nav-ul"><a class="nav-text" href="/play.page">Začni hrať</a></li>
                <li class="nav-ul"><a class="nav-text" href="/kartygal">Karty</a></li>
                <li class="nav-ul"><a class="nav-text" href="/decky">Decky</a></li> 
                <li class="nav-ul"><a class="nav-text" href="/forum">Fórum</a></li>
            </ul>
        </nav>
        <div class="header-user-action">
            {% if logged_in %}
                <a href="{{ url_for('editor') }}" class="profile-link" title="Profil">
                    {% if profile_pic %}
                        <img src="data:image/jpeg;base64,{{ profile_pic }}" alt="Profilová fotka" class="user-avatar">
                    {% else %}
                        <div class="user-avatar-placeholder">👤</div>
                    {% endif %}
                </a>
            {% else %}
                <a href="{{ url_for('login') }}" class="add-user-btn" title="Prihlásiť sa / Pridať účet">+</a>
            {% endif %}
        </div>
    </header>
    <aside class="left-info-panel">
        <h2>Vitaj v Riftoute</h2>
        <p>Porozprávaj sa s ostatnými na fóre, pozri sa na najnovšie karty alebo si skús zahrať s kamarátom (hranie sa ešte vyvíja) </p>
    </aside>
    <div class="split-bg-container">
        <div class="half-screen">
            <div class="scrolling-track track-top">
                <!-- SET 1 (Will be revealed as we pan right) -->
                <div class="image-set">
                    <img src="{{ url_for('static', filename='obrazky/shen.png') }}" alt="Shen">
                    <img src="{{ url_for('static', filename='obrazky/ahrihigh.png') }}" alt="Ahri">
                    <img src="{{ url_for('static', filename='obrazky/lux.jpg') }}" alt="lux">
                    <img src="{{ url_for('static', filename='obrazky/vexhigh.png') }}" alt="vex">
                    <img src="{{ url_for('static', filename='obrazky/jax.png') }}" alt="Jax">
                    <img src="{{ url_for('static', filename='obrazky/leona.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/mel.jpg') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/teemo.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/kaisa.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/jinxhigh.png') }}" alt="Jinx">
                </div>
                <!-- SET 2 (Duplicate for seamless loop) -->
                <div class="image-set">
                    <img src="{{ url_for('static', filename='obrazky/shen.png') }}" alt="Shen">
                    <img src="{{ url_for('static', filename='obrazky/ahrihigh.png') }}" alt="Ahri">
                    <img src="{{ url_for('static', filename='obrazky/lux.jpg') }}" alt="lux">
                    <img src="{{ url_for('static', filename='obrazky/vexhigh.png') }}" alt="vex">
                    <img src="{{ url_for('static', filename='obrazky/jax.png') }}" alt="Jax">
                    <img src="{{ url_for('static', filename='obrazky/leona.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/mel.jpg') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/teemo.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/kaisa.png') }}" alt="Karta 5">
                    <img src="{{ url_for('static', filename='obrazky/jinxhigh.png') }}" alt="Jinx">
                </div>
            </div>
        </div>   
    </div>
    <footer>Andrea Kmeťová</footer> 
</body>
</html>
